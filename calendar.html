<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<title>事件日历</title>
<style>
:root{
  --bg:#f7f6f3; --card:#ffffff; --ink:#1b1b1b; --sub:#6a6660; --line:#e4e1da;
  --accent:#b8342b; --build:#b8342b; --defend:#a4730b; --avoid:#33465c; --none:#7d8489;
  --ok:#1f7a4d; --bad:#b8342b; --na:#8a8a8a;
  --r:14px; --sh:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.045);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:64px}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.62 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-feature-settings:"tnum";
}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}

/* ---------- lock ---------- */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.lock-card{width:100%;max-width:370px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px 22px;box-shadow:0 2px 4px rgba(0,0,0,.03),0 18px 44px rgba(0,0,0,.07)}
.lock-logo{font-size:20px;font-weight:700;letter-spacing:2px;text-align:center}
.lock-sub{text-align:center;font-size:12.5px;color:var(--sub);margin:6px 0 20px;letter-spacing:.3px}
.lock-input{
  width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;
  font-size:15px;letter-spacing:1.6px;text-align:center;background:#fbfaf8;color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-transform:uppercase;
  transition:border-color .15s,background .15s;outline:none;
}
.lock-input:focus{border-color:var(--accent);background:#fff}
.lock-input::placeholder{color:#c2bdb5;letter-spacing:1.2px}
.lock-btn{
  width:100%;margin-top:11px;padding:13px;border:none;border-radius:10px;
  background:var(--accent);color:#fff;font-size:15px;font-weight:600;letter-spacing:1px;cursor:pointer;
  transition:opacity .15s;
}
.lock-btn:hover{opacity:.9}
.lock-btn:disabled{opacity:.5;cursor:default}
.lock-err{color:var(--accent);font-size:12.5px;margin-top:9px;min-height:18px;text-align:center;line-height:1.4}
.lock-buy{margin-top:16px;text-align:center;font-size:11.5px;color:#a09b93}
.lock-disc{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:10.5px;line-height:1.65;color:#a8a29a;text-align:left}
.lock-disc b{color:#8a857e;font-weight:600}
.buy-box{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;line-height:1.75;color:#4a4540}
.buy-box p{margin:0 0 8px}
.buy-box b{color:var(--ink)}
.qr{width:160px;height:160px;margin:12px auto 8px;border:1px dashed #cfcac2;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;color:#b0aba3;font-size:11.5px;line-height:1.6;padding:12px;background:#fbfaf8}
.qr-img{display:block;width:180px;max-width:90%;margin:14px auto 8px;border-radius:10px;border:1px solid var(--line)}
.buy-hint{text-align:center;font-size:11.5px;color:#a09b93}

/* header */
header{
  position:sticky;top:0;z-index:20;background:rgba(247,246,243,.92);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
}
.hd{max-width:820px;margin:0 auto;padding:13px 16px 11px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hd h1{font-size:17px;margin:0;letter-spacing:.3px;font-weight:700}
.hd .today{font-size:12.5px;color:var(--sub);margin-left:auto;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;padding:1.5px 7px;border-radius:999px;border:1px solid var(--line);color:var(--sub);background:#fff}

/* stat */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.stat b{display:block;font-size:21px;line-height:1.25;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat span{font-size:11.5px;color:var(--sub)}

/* section */
section{margin-top:26px}
h2{font-size:13px;letter-spacing:1.2px;color:var(--sub);margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
h2 .cnt{font-weight:400;color:#a09b93;letter-spacing:0}

/* note */
.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.7}
.note p{margin:0}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1.5px;background:var(--line)}
.tl-item{position:relative;margin-bottom:10px}
.tl-dot{position:absolute;left:-24px;top:17px;width:11px;height:11px;border-radius:50%;background:var(--card);border:2.5px solid var(--line)}
.tl-item.build .tl-dot{border-color:var(--build)}
.tl-item.defend .tl-dot{border-color:var(--defend)}
.tl-item.avoid .tl-dot{border-color:var(--avoid)}
.tl-item.none .tl-dot{border-color:var(--none)}
.tl-item.past{opacity:.5}
.tl-item.past .tl-dot{border-color:#c9c5bd}

/* event card */
.ev{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;box-shadow:var(--sh)}
.ev-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ev-date{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.ev-name{font-size:15px;font-weight:650;letter-spacing:.2px;margin-top:5px;line-height:1.4}
.ev-tag{font-size:10.5px;padding:1px 6px;border-radius:4px;background:#f0eee8;color:var(--sub);letter-spacing:.3px}
.ev-meta{font-size:12px;color:var(--sub);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.ev-act{margin-top:7px;font-size:13px;padding-top:7px;border-top:1px dashed var(--line);color:#3a3733}
.ev-act strong{font-weight:700}
.ev-act.build strong{color:var(--build)}
.ev-act.defend strong{color:var(--defend)}
.ev-act.avoid strong{color:var(--avoid)}

/* live list */
.live{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
.live-item{display:flex;gap:10px;padding:11px 13px;border-bottom:1px solid #f1efe9;align-items:flex-start}
.live-item:last-child{border-bottom:none}
.live-item .b{flex:0 0 auto;margin-top:2px}
.live-main{min-width:0;flex:1}
.live-name{font-size:14.5px;font-weight:650;line-height:1.4}
.live-name em{font-style:normal;font-weight:400;font-size:11.5px;color:var(--sub);margin-left:6px}
.live-act{font-size:12.6px;margin-top:4px;line-height:1.5;color:#3a3733}
.live-act strong{font-weight:700}
.live-act.build strong{color:var(--build)}
.evmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px}
.cflag{font-size:10.5px;padding:1px 6px;border-radius:4px;font-weight:600}
.cflag.fixed{background:#e7f5ee;color:#0c7a4d}
.cflag.est{background:#fff4e0;color:#9a5b00}
.cflag.dim{background:#f1efe9;color:#8a857d}
.evsrc{font-size:11px;color:#8a857d}
.sec{font-size:10.5px;color:#4f46e5;background:#eef2ff;border-radius:4px;padding:1px 6px}
.osn{display:block;font-size:11px;color:#9a5b00;margin-top:4px}
.evwatch,.evinv{font-size:11.8px;line-height:1.6;margin-top:5px;color:#5c574f}
.evinv{color:#9a5b00}
.live-act.defend strong{color:var(--defend)}
.live-act.avoid strong{color:var(--avoid)}

/* badge */
.b{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.b.hot{background:#fceae8;color:#b8342b}
.b.warm{background:#fbf1dc;color:#8c6200}
.b.cool{background:#e9eef4;color:#33465c}
.b.dim{background:#f0eee8;color:#7a756d}
.b.past{background:#f0eee8;color:#a09b93}

/* detail card */
.det{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:11px;box-shadow:var(--sh)}
.det-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.det-h .id{font-size:11px;color:#a8a29a;letter-spacing:.4px}
.det-h h3{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
.det-sub{font-size:12.5px;color:var(--sub);margin-bottom:10px;font-variant-numeric:tabular-nums}
.kv{font-size:13.5px;line-height:1.7;margin:7px 0}
.kv b{font-weight:600;color:#4a4540;font-size:12px;letter-spacing:.3px;display:inline-block;margin-right:6px}
.det blockquote{margin:9px 0;padding:8px 11px;background:#faf9f6;border-left:2.5px solid var(--line);border-radius:0 8px 8px 0;font-size:13px;color:#4a4540}
.det blockquote b{color:var(--accent)}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th{text-align:left;font-weight:600;font-size:11.5px;color:var(--sub);letter-spacing:.4px;padding:5px 7px;border-bottom:1px solid var(--line);background:#fbfaf8}
td{padding:6px 7px;border-bottom:1px solid #f0eee8;vertical-align:top;line-height:1.5}
tr:last-child td{border-bottom:none}
.tier{font-size:11px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.tier.A{color:var(--build)} .tier.B{color:var(--defend)} .tier.C{color:var(--avoid)}
.code{color:#a8a29a;font-size:11.5px;font-variant-numeric:tabular-nums}
.tg-h{font-size:11.5px;font-weight:650;letter-spacing:.5px;margin:11px 0 2px;color:#4a4540;display:flex;align-items:baseline;gap:7px}
.tg-h span{font-weight:400;font-size:10.5px;color:#a09b93;letter-spacing:0}
.ov{font-size:9.5px;padding:0 4px;border-radius:3px;background:#fbf1dc;color:#8c6200;margin-left:4px;white-space:nowrap}
.lv{font-size:9.5px;padding:0 4px;border-radius:3px;margin-left:4px;white-space:nowrap;font-weight:600}
.lv-s{background:#fdecea;color:#b8342b}
.lv-a{background:#fdf1e0;color:#b06000}
.lv-b{background:#eef4fb;color:#33506e}
.lv-co{background:#f1f0ec;color:#8a857c}
.ov.x{background:#eef4fb;color:#33506e}
.vs{font-size:9px;padding:0 4px;border-radius:3px;margin-left:4px;white-space:nowrap;font-weight:600;vertical-align:1px}
.vs.weak{background:#e9f5ee;color:#1f7a4d}
.cl{background:#fdf6ec;border:1px solid #f0e2c8;border-radius:10px;padding:10px 12px;margin-top:9px;font-size:12.5px;line-height:1.65}
.cl-t{font-weight:650;color:#8a6d3b;margin-bottom:4px;letter-spacing:.3px}
.cl-row{color:#5a534a;margin-top:3px}
.cl b{color:#8a6d3b}
.vs.strong{background:#fdecea;color:#b8342b}
.v{font-size:10px;padding:0 5px;border-radius:3px;border:1px solid;letter-spacing:.3px;white-space:nowrap}
.v.ok{color:#1f7a4d;border-color:#b8ddc9;background:#eef8f2}
.v.warn{color:#8c6200;border-color:#e8d5a8;background:#fdf7ea}
.v.dim{color:#8a8a8a;border-color:#e0ddd6;background:#f4f3ef}

/* review */
.rv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:11px;box-shadow:var(--sh)}
.rv-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.rv-h h3{font-size:15px;margin:0;font-weight:650}
.flag{font-size:11px;font-weight:700;padding:1.5px 7px;border-radius:5px}
.flag.ok{background:#e6f4ec;color:var(--ok)}
.flag.bad{background:#fceae8;color:var(--bad)}
.flag.na{background:#efeeea;color:var(--na)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 10px}
.cell{background:#fbfaf8;border:1px solid #efede7;border-radius:8px;padding:6px 8px;text-align:center}
.cell i{display:block;font-style:normal;font-size:10.5px;color:var(--sub);letter-spacing:.3px}
.cell b{font-size:14.5px;font-variant-numeric:tabular-nums}
.up{color:#c0392b} .down{color:#1f7a4d}

/* watch */
.wt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.wt-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wt-h .id{font-size:10.5px;color:#a8a29a;letter-spacing:.5px}
.wt-h b{font-size:14.5px;font-weight:650}
.wt-h .win{font-size:11.5px;color:var(--defend);background:#fbf1dc;padding:1px 6px;border-radius:4px;margin-left:auto}
.wt p{margin:5px 0 0;font-size:12.8px;color:#4a4540;line-height:1.6}
.wt p b{color:var(--sub);font-weight:600;font-size:11.5px;margin-right:4px}

/* footer */
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:#a09b93;line-height:1.75}
footer .fh{font-size:11.5px;font-weight:650;color:#6f6a63;margin:13px 0 3px;letter-spacing:.02em}
footer .fz{display:block;font-size:11.5px;line-height:1.75;color:#a09b93}
footer b{color:var(--sub);font-weight:600}
.lic-line{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lic-line .lk{color:#a09b93}
.lic-line button{margin-left:auto;font-size:11px;color:var(--sub);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer}
.disc{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:10.5px;line-height:1.7;color:#a8a29a}
.disc b{color:#8a857e;font-weight:600}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:14px;font-size:13px;color:var(--sub);text-align:center}

/* movers */
.mv{margin-top:11px;padding-top:9px;border-top:1px solid var(--line)}
.mv-h{font-size:11px;color:var(--sub);letter-spacing:.6px;margin-bottom:2px;font-weight:600}
.mv-row{display:flex;gap:6px;align-items:baseline;font-size:12.5px;line-height:1.5;padding:4px 0;border-bottom:1px dashed #f2f0ea}
.mv-row:last-of-type{border-bottom:none}
.mv-row .nm{font-weight:600;white-space:nowrap}
.mv-row .cd{color:#b0aba3;font-size:10.5px;font-variant-numeric:tabular-nums}
.mv-row .why{color:#a09b93;font-size:10.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv-row .pc{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mv-b{font-size:10.5px;color:#b0aba3;margin-top:5px;line-height:1.5}

/* toc */
.toc{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
.toc-i{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #f1efe9;text-decoration:none;color:inherit;font-size:13px}
.toc-i:last-child{border-bottom:none}
.toc-i:active{background:#faf9f6}
.toc-i .td2{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:78px;white-space:nowrap}
.toc-i .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.tl-item:target .ev{outline:2px solid var(--accent);outline-offset:2px}

@media(max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .hd h1{font-size:15.5px}
  .ev-name{font-size:14.5px}
  body{font-size:14.5px}
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#141413; --card:#1c1c1b; --ink:#eeece7; --sub:#9b968e; --line:#2e2e2c;
    --accent:#e0665c; --build:#e0665c; --defend:#d6a63b; --avoid:#8fa9c4; --none:#8d9297;
    --ok:#5dbb8a;
  }
  header{background:rgba(20,20,19,.93)}
  th{background:#232322}
  .cell{background:#232322;border-color:#2e2e2c}
  .det blockquote{background:#232322}
  .ev-tag{background:#262625}
  .empty{background:#1c1c1b}
  .lock-input{background:#232322}
  .lock-input:focus{background:#262625}
  .qr{background:#232322;border-color:#3a3a37}
}

/* 数据过期提示条（2026-11-04 加）：定时任务在本环境不可用，页面靠会话内补跑更新，
   一旦长时间没更新必须自己喊出来，不能让人以为是最新行情 */
.stale{margin:0 0 14px;padding:11px 14px;border:1px solid #e8c96a;border-left:4px solid #d99b1a;
  background:#fdf6e3;border-radius:6px;font-size:13.5px;line-height:1.65;color:#6b4c0e}
.stale b{color:#a5650a;margin-right:6px}
.stale em{font-style:normal;font-weight:700;color:#8a4b00}

.note-tag{font-size:11.5px;color:var(--muted,#8a8578);letter-spacing:.02em;margin-bottom:5px}
.note-auto{background:transparent;border-left-color:#c9c3b4}
.note-old{opacity:.7;border-left-color:#c9a83a;background:#fbf8ef}
.note-old p{color:#5f5a50}
.gap-note{margin-top:8px;font-size:12px;color:#9a6a1a}
/* 逾期未复盘：积压清单，逾期越久越靠上 */
.od{margin-top:10px}
.od-row{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.od-row:last-child{border-bottom:0}
.od-gap{flex:0 0 62px;font-weight:700;color:#b3261e}
.od-name{flex:1}
.od-meta{flex:0 0 auto;color:var(--muted,#8a8578);font-size:12px}

.wt-od{border-left:3px solid #b3261e}
.od-badge{margin-left:auto;font-size:11.5px;color:var(--muted,#8a8578);white-space:nowrap}
.od-badge.od-hot{color:#b3261e;font-weight:700}
.hnote{max-width:820px;margin:0 auto;padding:0 16px 12px;font-size:12.5px;line-height:1.7;color:#6b7280;text-align:left}
.hnote b{color:#374151;font-weight:600}
</style>
</head>
<body><style>
#hubbar{position:sticky;top:0;z-index:9999;display:flex;align-items:center;gap:2px;
background:#0f172a;border-radius:9px;padding:0 10px;height:36px;margin:0 0 14px;
box-shadow:0 2px 10px rgba(15,23,42,.16);font:12px/1 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#hubbar::-webkit-scrollbar{display:none}
#hubbar a,#hubbar .hb-cur,#hubbar .hb-home{flex:none;display:inline-flex;align-items:center;
height:24px;padding:0 10px;border-radius:6px;text-decoration:none;color:#cbd5e1;
font-size:12px;letter-spacing:.2px;transition:background .13s,color .13s}
#hubbar a:hover{background:rgba(255,255,255,.1);color:#fff}
#hubbar .hb-home{color:#94a3b8;font-weight:400;margin-right:2px;padding-left:2px}
#hubbar .hb-home:hover{background:transparent;color:#e2e8f0}
#hubbar .hb-sep{flex:none;width:1px;height:14px;background:#334155;margin:0 6px}
#hubbar .hb-cur{background:#d93630;color:#fff;font-weight:600;cursor:default}
#hubbar .hb-sp{flex:1 1 auto;min-width:0}
#hubbar .hb-t{flex:none;color:#64748b;font-size:11px;padding-right:2px;white-space:nowrap}
@media(max-width:560px){
#hubbar{height:34px;padding:0 6px;margin:0 0 12px;border-radius:8px}
#hubbar a,#hubbar .hb-cur,#hubbar .hb-home{height:22px;padding:0 8px;font-size:11.5px}
/* 390px 宽放不下「← 中心」+ 5 个入口，缩成纯箭头腾出 ~24px，尽量整条不滚动 */

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function sha16(s){
  const h = await crypto.subtle.digest("SHA-256", te.encode(s));
  return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,"0")).join("").slice(0,16);
}

  const base = await crypto.subtle.importKey("raw", te.encode(code), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64d(saltB64), iterations:ITER, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]
  );
}

  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(ivB64)}, key, b64d(ctB64));

/* 原「已验证因果链 · 不受窗口限制」是过期事件常驻的原因：
   它只判内容字段、不看日期，GTC 柏林过了 20 多天还占一整块。
   现在拆成三处，各自有明确的时间边界：
     · 作战预案 —— 未发生、写了 playbook，留在主视图
     · 复盘区   —— 已发生且已复盘，只在复盘区出现一次（不在这里重复）
     · 历史案例库 —— 有因果记录但超过 30 天且没复盘，默认折叠 */
function sectionCausal(evs){
  const has = e => e.association || e.causal_chain || e.playbook;
  const plan = evs.filter(e => e.playbook && !e.review && (tOf(e) === null || tOf(e) >= 0));
  const old = evs.filter(e => {
    if(!has(e) || e.playbook || e.review) return false;
    const t = tOf(e);
    return t === null || t < -30;
  });
  let h = '';
  if(plan.length){
    h += '<section><h2>作战预案 <span class="cnt">' + plan.length + ' 个 · 事件未发生</span></h2>' +
      '<div class="sp"></div>' + plan.map(causalCard).join('') + '</section>';
  }
  if(old.length){
    h += '<section><h2>历史案例库 <span class="cnt">' + old.length + ' 条 · 已过 30 天，默认收起</span></h2>' +
      '<div id="archMore" style="display:none">' + old.map(causalCard).join('') + '</div>' +
      '<button class="more-btn" data-more="展开历史案例 ' + old.length + ' 条" ' +
      'onclick="toggleMore(\'archMore\',this)">展开历史案例 ' + old.length + ' 条</button></section>';
  }
  return h;
}

function sectionNote(){
  const m = DATA.meta || {};
  const manual = (m.week_note_manual || "").trim();
  const auto = (m.week_note_auto || "").trim();
  const merged = (m.week_note || "").trim();
  if(!manual && !auto && !merged) return "";
  let h = '<section><h2>这一周怎么打</h2>';
  if(manual){
    let tag = "人工判断", cls = "note";
    const md = m.week_note_manual_date || "";
    let gap = 0;
    if(md){
      const dd = D(md);
      gap = dd ? Math.round((TODAY - dd) / 86400000) : 0;
      tag = "人工判断 · 写于 " + md.slice(5).replace("-", "/");
      if(gap > 5) cls = "note note-old";
    }
    // 超过 5 天的判断默认收起：它是当时的看法，不是当下的结论，不该占首屏
    if(gap > 5){
      h += '<details class="' + cls + '"><summary class="note-tag">' + esc(tag) +
        '，已过期 ' + gap + ' 天 · 点击展开（仅作背景）</summary><p>' + md2html(esc(manual)) + '</p></details>';
    } else {
      h += '<div class="' + cls + '"><div class="note-tag">' + esc(tag) + '</div><p>' + md2html(esc(manual)) + '</p></div>';
    }
  }
  if(auto){
    h += '<div class="note note-auto"><div class="note-tag">自动生成 · ' + esc((m.updated || "").slice(5).replace("-", "/")) + ' 重算</div><p>' + md2html(esc(auto)) + '</p></div>';
  } else if(!manual && merged){
    h += '<div class="note"><p>' + md2html(esc(merged)) + '</p></div>';
  }
  if(m.scan_gaps && m.scan_gaps.length){
    h += '<div class="gap-note">涨停扫描缺 ' + m.scan_gaps.length + ' 个交易日（' + esc(m.scan_gaps.join("、")) + '）：源只提供当日数据，无法回溯，这几天的方向强度不可比。</div>';
  }
  return h + '</section>';
}

function sectionOverdue(evs){
  const rows = evs.filter(e => {
    const d = D(e.date_start);
    if(!d || d >= TODAY || e.review) return false;
    // 超过 14 天仍未复盘的，不再天天提醒（进历史案例库），避免老账刷屏
    return Math.round((TODAY - d) / 86400000) <= 14;
  }).map(e => {
    const d = D(e.date_start);
    return {e: e, gap: Math.round((TODAY - d) / 86400000)};
  }).sort((a, b) => b.gap - a.gap);
  if(!rows.length) return "";
  let h = '<section><h2>逾期未复盘 <span class="cnt">' + rows.length + ' 条 · 事件已过但没记反应</span></h2><div class="od">';
  rows.forEach(r => {
    const e = r.e;
    const codes = (function(){
      const tg = e.targets || {}, out = {};
      (tg.lines || [tg]).forEach(g => ["emotion", "main"].forEach(k => (g[k] || []).forEach(t => { if(t.code) out[t.code] = 1; })));
      return Object.keys(out).length;
    })();
    h += '<div class="od-row"><span class="od-gap">逾期 ' + r.gap + ' 天</span>' +
      '<span class="od-name">' + esc(e.name) + '</span>' +
      '<span class="od-meta">' + fmtDate(e) + ' · ' + esc(e.level || "") + ' · 标的 ' + codes + ' 只</span></div>';
  });
  return h + '</div></section>';
}

function inCore(e){
  const t = tOf(e);
  return t !== null && t >= 0 && t <= 5;
}

function toggleMore(id, btn){
  const el = document.getElementById(id);
  const hidden = el.style.display === "none";
  el.style.display = hidden ? "block" : "none";
  btn.textContent = hidden ? "收起" : (btn.dataset.more || "展开全部");
  btn.className = hidden ? "more-btn open" : "more-btn";
}

function tocRow(e){
  const t = tOf(e);
  return '<a class="toc-i" href="#ev-' + esc(e.id) + '"><span class="td2">' + fmtDate(e) + '</span>' +
    '<span class="tn">' + esc(e.name) + '</span>' + badge(t) + '</a>';
}

function sectionTOC(evs){
  const items = evs.filter(e => { const t = tOf(e); return t !== null && t >= 0 && t <= 30; });
  if(!items.length) return "";
  const core = items.filter(inCore);
  const rest = items.filter(e => !inCore(e));
  let h = '<section><h2>速览 <span class="cnt">' + core.length + ' 个 · 5 日内</span></h2>';
  h += '<div class="toc">' + (core.length ? core.map(tocRow).join("") : '<div class="empty" style="border:none">5 日内无事件</div>') + '</div>';
  if(rest.length){
    const label = "展开全部 " + rest.length + " 个（5 日外）";
    h += '<div class="toc" id="tocMore" style="display:none;margin-top:8px">' + rest.map(tocRow).join("") + '</div>';
    h += '<button class="more-btn" data-more="' + label + '" onclick="toggleMore(&#39;tocMore&#39;,this)">' + label + '</button>';
  }
  h += '</section>';
  return h;
}

function sectionLive(evs){
  const rows = evs.filter(e => {
    const t = tOf(e);
    if(t === null) return false;
    if(t >= 0 && t <= 7) return true;
    return t > 7 && t <= parseInt(e.entry_window || 7, 10) + 7;
  }).sort((a,b) => (tOf(a)??99) - (tOf(b)??99));
  if(!rows.length) return '<section><h2>今日与近期重点</h2><div class="empty">当前无事件在窗口内</div></section>';
  const body = rows.map(e => {
    const t = tOf(e), k = kindOf(e);
    const sectors = (e.sectors || []).slice(0,4).map(s => '<span class="sec">' + esc(s) + '</span>').join("");
    const watch = e.watch ? '<div class="evwatch">市场在等：' + md2html(esc(e.watch)) + '</div>' : '';
    const invalid = e.invalidate ? '<div class="evinv">证伪条件：' + md2html(esc(e.invalidate)) + '</div>' : '';
    const src = e.evidence_src || e.confirm || "—";
    return '<div class="live-item">' + badge(t) +
      '<div class="live-main"><div class="live-name">' + esc(e.name) +
      '<em>' + k.label + ' · ' + stars(e.strength) + '</em>' + vbadge(e) + '</div>' +
      '<div class="evmeta">' + confirmLabel(e) + '<span class="evsrc">来源：' + esc(src) + '</span>' + sectors + '</div>' +
      overseasNote(e) + watch + invalid +
      '<div class="live-act ' + k.cls + '">' + md2html(esc(action(e, t))) + '</div></div></div>';
  }).join("");
  return '<section><h2>今日与近期重点 <span class="cnt">' + rows.length + ' 个 · 日期类型 / 来源 / 影响板块 / 市场在等什么</span></h2><div class="live">' + body + '</div></section>';
}

function tlCard(e){
  const t = tOf(e), k = kindOf(e);
  const cls = (t !== null && t < 0 ? "past " : "") + k.cls;
  return '<div class="tl-item ' + cls + '" id="ev-' + esc(e.id) + '"><div class="tl-dot"></div><div class="ev">' +
    '<div class="ev-date">' + fmtDate(e) + badge(t) + '</div>' +
    '<div class="ev-name">' + esc(e.name) + '</div>' +
    '<div class="ev-meta"><span class="ev-tag">' + esc(e.type || "") + '</span>' +
    '<span>' + stars(e.strength) + '</span><span>' + esc(e.confirm) + '</span>' +
    '<span>' + k.label + '型</span>' + levelBadge(e) + '</div>' +
    '<div class="ev-act ' + k.cls + '">' + md2html(esc(action(e, t))) + '</div></div></div>';
}

function sectionTimeline(evs){
  const items = evs.filter(e => { const t = tOf(e); return t !== null && t >= 0 && t <= 30; });
  if(!items.length) return "";
  const core = items.filter(inCore);
  const rest = items.filter(e => !inCore(e));
  let h = '<section><h2>时间轴 <span class="cnt">' + core.length + ' 个 · 5 日内</span></h2>';
  h += '<div class="tl">' + (core.length ? core.map(tlCard).join("") : '<div class="empty">5 日内无事件</div>') + '</div>';
  if(rest.length){
    const label = "展开全部 " + rest.length + " 个（5 日外）";
    h += '<div class="tl" id="tlMore" style="display:none;margin-top:10px">' + rest.map(tlCard).join("") + '</div>';
    h += '<button class="more-btn" data-more="' + label + '" onclick="toggleMore(&#39;tlMore&#39;,this)">' + label + '</button>';
  }
  h += '</section>';
  return h;
}

function sectionDetail(evs){
  const open = evs.filter(e => { const t = tOf(e); return t !== null && t >= 0 && t <= 5; });
  if(!open.length) return "";
  const cards = open.map(e => {
    const t = tOf(e), k = kindOf(e);
    let h = '<div class="det"><div class="det-h"><span class="id">' + esc(e.id) + '</span><h3>' + esc(e.name) + '</h3>' + badge(t) + '</div>';
    h += '<div class="det-sub">' + fmtDate(e) + '｜' + stars(e.strength) + '｜' + esc(e.confirm) + ' ｜窗口 T-' + parseInt(e.entry_window || 7, 10) + ' ' + levelBadge(e) + ' ' + vbadge(e) + '</div>';
    h += '<div class="ev-act ' + k.cls + '">' + md2html(esc(action(e, t))) + '</div>';
    if(e.date_note) h += '<blockquote>' + md2html(esc(e.date_note)) + '</blockquote>';
    if(e.sectors && e.sectors.length) h += '<div class="kv"><b>映射</b>' + e.sectors.map(esc).join("、") + '</div>';
    if(e.watch) h += '<div class="kv"><b>看什么</b>' + esc(e.watch) + '</div>';
    if(e.invalidate) h += '<div class="kv"><b>失效</b>' + esc(e.invalidate) + '</div>';
    h += causalBlock(e);
    const tg = e.targets || {};
    const lines = Array.isArray(tg.lines) ? tg.lines : [];
    const emo = lines.length ? [] : (Array.isArray(tg.emotion) ? tg.emotion : []);
    const mai = lines.length ? [] : (Array.isArray(tg.main) ? tg.main : []);
    if(e.action_kind === "avoid" || e.action_kind === "none"){
      if(!e.invalidate) h += '<div class="kv">本事件不作为开仓依据，作用是调整仓位，不是改变持仓结构。</div>';
    } else if(lines.length){
      lines.forEach(L => {
        const le = Array.isArray(L.emotion) ? L.emotion : [];
        const lm = Array.isArray(L.main) ? L.main : [];
        h += '<div class="tg-h">' + esc(L.line) + '<span>' + esc(L.basis || "") + '</span></div>';
        if(le.length){
          h += '<table><thead><tr><th>情绪</th><th>涨幅</th><th>理由</th></tr></thead><tbody>';
          le.forEach(o => {
            const dup = lm.some(m => m.code === o.code);
            h += '<tr><td>' + esc(o.name) + (o.code ? ' <span class="code">' + esc(o.code) + '</span>' : '') +
              (dup ? '<span class="ov">重合</span>' : '') + '</td><td class="' + (o.pct >= 0 ? 'up' : 'down') + '">' +
              (o.pct > 0 ? "+" : "") + Number(o.pct).toFixed(1) + '%' + vsTag(o) + '</td><td>' + esc(o.why) + '</td></tr>';
          });
          h += '</tbody></table>';
        }
        if(lm.length){
          h += '<table><thead><tr><th>中军</th><th>成交额</th><th>流通市值</th><th>理由</th></tr></thead><tbody>';
          lm.forEach(o => {
            h += '<tr><td>' + esc(o.name) + (o.code ? ' <span class="code">' + esc(o.code) + '</span>' : '') +
              (o.overlap ? '<span class="ov">重合</span>' : '') + '</td><td>' + Number(o.amt).toFixed(1) + '亿</td>' +
              '<td>' + Number(o.mcap).toFixed(0) + '亿</td><td>' + esc(o.why) + '</td></tr>';
          });
          h += '</tbody></table>';
        }
      });
    } else if(emo.length || mai.length){
      if(emo.length){
        h += '<div class="tg-h">情绪标的<span>当日涨跌幅前 3 · 看弹性</span></div>';
        h += '<table><thead><tr><th>标的</th><th>涨幅</th><th>理由</th></tr></thead><tbody>';
        emo.forEach(o => {
          const dup = mai.some(m => m.code === o.code);
          h += '<tr><td>' + esc(o.name) + (o.code ? ' <span class="code">' + esc(o.code) + '</span>' : '') +
            (dup ? '<span class="ov">重合</span>' : '') + '</td><td class="' + (o.pct >= 0 ? 'up' : 'down') + '">' +
            (o.pct > 0 ? "+" : "") + Number(o.pct).toFixed(1) + '%' + vsTag(o) + '</td><td>' + esc(o.why) + '</td></tr>';
        });
        h += '</tbody></table>';
      }
      if(mai.length){
        h += '<div class="tg-h">中军<span>成交额前 3 · 看容量与承接</span></div>';
        h += '<table><thead><tr><th>标的</th><th>成交额</th><th>流通市值</th><th>理由</th></tr></thead><tbody>';
        mai.forEach(o => {
          h += '<tr><td>' + esc(o.name) + (o.code ? ' <span class="code">' + esc(o.code) + '</span>' : '') +
            (o.overlap ? '<span class="ov">重合</span>' : '') + '</td><td>' + Number(o.amt).toFixed(1) + '亿</td>' +
            '<td>' + Number(o.mcap).toFixed(0) + '亿</td><td>' + esc(o.why) + '</td></tr>';
        });
        h += '</tbody></table>';
      }
    } else {
      h += '<div class="kv" style="color:#a09b93">尚无标的清单</div>';
    }
    if(e.note) h += '<blockquote>' + md2html(esc(e.note)) + '</blockquote>';
    if(e.evidence && e.evidence.note) h += '<div class="kv" style="font-size:12px;color:#a09b93"><b>核实</b>' + esc(e.evidence.note) + '</div>';
    h += moversBlock(e);
    return h + '</div>';
  }).join("");
  return '<section><h2>窗口已开 · 逐个拆解 <span class="cnt">' + open.length + ' 个</span></h2>' + cards + '</section>';
}

function sectionReview(evs){
  // 按事件发生日倒序（不是按复盘填写日）：读者要看「最近发生的事件结果如何」，
  // 按填写日排会让同一批补写的旧事件靠前（GTC 柏林 10/20 就排到了第一个）
  const done = evs.filter(e => e.review).sort((a, b) => String(b.date_start).localeCompare(String(a.date_start)));
  // 2026-11-27：去掉独立「待打分 / 逾期未复盘」清单；复盘状态随事件保留在本区，不再单列焦虑清单。
  let h = '<section><h2>复盘 <span class="cnt">历史事件的复盘记录 · 状态随事件保留</span></h2>';
  if(!done.length) return h + '<div class="empty">暂无复盘记录</div></section>';
  const LIMIT = 3;
  const show = done.slice(0, LIMIT), rest = done.slice(LIMIT);
  if(rest.length){
    h += '<div style="font-size:11.5px;color:#a09b93;margin-bottom:8px">' +
      '只列最近 ' + LIMIT + ' 条，更早的 ' + rest.length + ' 条已收起（数据仍保留，可展开）</div>';
  }
  const rvCard = e => {
    const r = e.review;
    let c = '';
    const flag = r.valid === true ? '<span class="flag ok">有效</span>' : r.valid === false ? '<span class="flag bad">无效</span>' : '<span class="flag na">无法归因</span>';
    c += '<div class="rv"><div class="rv-h"><h3>' + esc(e.name) + '</h3>' + flag + '</div>';
    c += '<div class="grid4">' +
      '<div class="cell"><i>T 日绝对</i><b>' + pct(r.abs_T) + '</b></div>' +
      '<div class="cell"><i>T 日超额</i><b>' + pct(r.excess_T) + '</b></div>' +
      '<div class="cell"><i>T+1 绝对</i><b>' + pct(r.abs_T1) + '</b></div>' +
      '<div class="cell"><i>T+1 超额</i><b>' + pct(r.excess_T1) + '</b></div></div>';
    if(r.verdict) c += '<div class="kv"><b>结论</b>' + esc(r.verdict) + '</div>';
    if(r.note) c += '<div class="kv" style="color:#4a4540">' + esc(r.note) + '</div>';
    if(r.self_error) c += '<blockquote><b>我的判断错在哪</b>：' + esc(r.self_error) + '</blockquote>';
    c += moversBlock(e);
    c += '</div>';
    return c;
  };
  h += show.map(rvCard).join("");
  if(rest.length){
    h += '<div id="rvMore" style="display:none">' + rest.map(rvCard).join("") + '</div>';
    h += '<button class="more-btn" data-more="展开更早的 ' + rest.length + ' 条" ' +
      'onclick="toggleMore(&#39;rvMore&#39;,this)">展开更早的 ' + rest.length + ' 条</button>';
  }
  const stat = {};
  done.forEach(e => {
    const k = e.type || "其他";
    stat[k] = stat[k] || {n:0, ok:0, na:0};
    const v = e.review.valid;
    if(v === null || v === undefined) stat[k].na++;
    else { stat[k].n++; if(v) stat[k].ok++; }
  });
  h += '<div class="ev" style="padding:4px 10px"><table><thead><tr><th>类型</th><th>可归因</th><th>判有效</th><th>胜率</th><th>无法归因</th></tr></thead><tbody>';
  Object.keys(stat).forEach(k => {
    const s = stat[k];
    h += '<tr><td>' + esc(k) + '</td><td>' + s.n + '</td><td>' + s.ok + '</td><td>' + (s.n ? Math.round(s.ok / s.n * 100) + "%" : "—") + '</td><td>' + s.na + '</td></tr>';
  });
  h += '</tbody></table></div>';
  h += '<div style="font-size:11.5px;color:#a09b93;margin-top:6px">样本少时严重失真，只作参考；无法归因不计入胜率。</div>';
  return h + '</section>';
}

function wGap(w){
  if(!w.due || w.resolved) return null;
  const d = D(w.due);
  return d ? Math.round((TODAY - d) / 86400000) : null;
}

function sectionWatch(){
  const ws = (DATA.watch || []).slice().sort((a, b) => {
    const ga = wGap(a), gb = wGap(b);
    return (gb === null ? -999 : gb) - (ga === null ? -999 : ga);
  });
  if(!ws.length) return "";
  const od = ws.filter(w => (wGap(w) || -1) > 0).length;
  const cards = ws.map(w => {
    const g = wGap(w);
    const late = g !== null && g > 0;
    const tag = w.resolved ? "已处理"
      : g === null ? ("至 " + (w.due || "").slice(5).replace("-", "/"))
      : late ? "逾期 " + g + " 天未处理" : (g === 0 ? "今天到期" : "剩 " + (-g) + " 天");
    return '<div class="wt' + (late ? ' wt-od' : '') + '"><div class="wt-h"><span class="id">' + esc(w.id) + '</span><b>' + esc(w.name) + '</b>' +
      '<span class="win">' + esc(w.window) + '</span>' +
      '<span class="od-badge' + (late ? ' od-hot' : '') + '">' + esc(tag) + '</span></div>' +
      '<p><b>为什么</b>' + esc(w.why) + '</p>' +
      '<p><b>怎么打</b>' + esc(w.play) + '</p>' +
      (w.trigger ? '<p><b>触发</b>' + esc(w.trigger) + '</p>' : '') + '</div>';
  }).join("");
  return '<section><h2>观察项 <span class="cnt">' + ws.length + ' 个' + (od ? ' · ' + od + ' 个已过期待处理' : ' · 日期未定不参与') + '</span></h2>' + cards + '</section>';
}

/* 数据过期检查：数据日期落后 2 个工作日以上就在顶部喊出来 */
function wdaysBetween(a, b){
  let n = 0, d = new Date(a.getTime());
  while(d < b){
    d.setDate(d.getDate() + 1);
    if(d.getDay() !== 0 && d.getDay() !== 6) n++;
  }
  return n;
}
function renderStale(data){
  const box = $("stale"); if(!box) return;
  const meta = (data && data.meta) || {};
  const m = String(meta.updated || meta.last_run || "").match(/(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return;
  const up = new Date(+m[1], +m[2]-1, +m[3]);
  const wd = wdaysBetween(up, TODAY);
  if(wd < 2) return;
  const head = (meta.as_of || "").indexOf("盘中") >= 0 ? "盘中快照" : "收盘数据";
  box.hidden = false;
  box.innerHTML = '<b>数据已过期</b>行情停在 ' + m[0] + '（' + esc(head) + '），已落后 <em>' + wd + '</em> 个交易日。' +
    ' 在 WorkBuddy 里说一句「更新今天的」即可刷新。';
}

function boot(data){
  DATA = data;
  const evs = (data.events || []).slice().sort((a, b) => {
    const x = D(a.date_start), y = D(b.date_start);
    if(!x && !y) return 0;
    if(!x) return 1;
    if(!y) return -1;
    return x - y;
  });
  $("today").textContent = TODAY.getFullYear() + "-" + pad(TODAY.getMonth()+1) + "-" + pad(TODAY.getDate()) + " 周" + WEEK[TODAY.getDay()];
  // 跨年时两端都带年份，否则「10/22 — 08/31」会让人误以为是同一年
  (function(){
    const c0 = String(data.meta.coverage[0]), c1 = String(data.meta.coverage[1]);
    const cross = c0.slice(0,4) !== c1.slice(0,4);
    $("cover").textContent = "覆盖 " +
      (cross ? c0 : c0.slice(5).replace("-","/")) + " — " +
      (cross ? c1 : c1.slice(5).replace("-","/"));
  })();
  $("app").innerHTML = sectionNote() + sectionOverdue(evs) + sectionTOC(evs) + sectionLive(evs) + sectionDetail(evs) + sectionCausal(evs) + sectionTimeline(evs) + sectionReview(evs) + sectionWatch();
  renderStats(evs);
  renderStale(data);

  const left = daysLeft(CURRENT.exp);
  $("foot").innerHTML =
    '<b>数据截至</b> ' + esc(data.meta.updated) + '<br>' +
    '剩余天数与动作按打开当天实时计算，无需手动更新。<br>' +
    '<div class="fh">免责声明</div>' +
    '<span class="fz">本页全部数据来源于公开渠道并尽力核对，但不保证绝对完整与无误；如与交易所、指数编制机构或基金管理人正式披露不一致，一律以官方披露为准。所有分级、信号、筛选与主观判断，均为基于历史数据的统计规则或个人观点，不构成任何投资建议，不预测未来收益，也不代表任何产品的业绩承诺。使用者应独立判断并自行承担决策风险，据此操作，风险自担。</span>' +
    '<div class="fh">作者信息</div>' +
    '<span class="fz">作者：大S股市每日复盘　·　数据整理、制表与页面制作：本人独立完成　·　本页仅限内部研究使用，未经许可请勿转载或商用　·　页面更新于 <span style="white-space:nowrap">' + esc(BUILD) + '</span></span>';
}

/* ---------- 启动 ---------- */
(function init(){
  var v = $("ver"); if (v) v.textContent = "v" + BUILD;
  $("main").style.display = "block";
  boot(DATA);
})();
</script>
